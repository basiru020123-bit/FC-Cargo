<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FC Cargo — Banjul</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--pd:#534AB7;--p:#7F77DD;--pl:#EEEDFE;--pt:#3C3489;--r:#E24B4A;--rd:#A32D2D;--rl:#FCEBEB;--rt:#791F1F;--g:#639922;--gd:#3B6D11;--gl:#EAF3DE;--gt:#27500A;--a:#BA7517;--al:#FAEEDA;--at:#633806;--ink:#1a1a1a;--ink2:#555;--ink3:#888;--bg:#fff;--bg2:#f7f6f2;--bg3:#f0ede8;--border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.2)}
body{font-family:'Segoe UI',sans-serif;background:var(--bg3);color:var(--ink);font-size:13px;}
.shell{display:flex;min-height:100vh;}
.sidebar{width:190px;background:var(--pd);min-height:100vh;flex-shrink:0;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:10;}
.logo-area{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.15);}
.logo-txt{font-size:17px;font-weight:700;color:#fff;letter-spacing:1px;}
.logo-sub{font-size:9px;color:rgba(255,255,255,.5);margin-top:2px;letter-spacing:1px;}
.role-sel{margin:10px 10px 2px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:11px;padding:6px 8px;width:calc(100% - 20px);border-radius:6px;cursor:pointer;}
.role-sel option{color:#000;background:#fff;}
.nav-sec{padding:14px 14px 4px;font-size:9px;letter-spacing:2px;color:rgba(255,255,255,.35);text-transform:uppercase;}
.ni{padding:9px 14px;cursor:pointer;display:flex;align-items:center;gap:9px;color:rgba(255,255,255,.65);font-size:12px;border-left:3px solid transparent;transition:all .15s;}
.ni:hover{color:#fff;background:rgba(255,255,255,.08);}
.ni.active{color:#fff;border-left-color:#fff;background:rgba(255,255,255,.13);}
.ni i{font-size:16px;}
.live-dot{width:7px;height:7px;border-radius:50%;background:#5DCAA5;display:inline-block;animation:pulse 1.8s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.main{flex:1;margin-left:190px;overflow:auto;background:var(--bg3);}
.topbar{padding:14px 22px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5;}
.page-title{font-size:16px;font-weight:700;color:var(--ink);}
.topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.btn{padding:6px 13px;border:1px solid var(--border2);background:var(--bg);color:var(--ink);font-size:11px;border-radius:6px;cursor:pointer;}
.btn:hover{background:var(--bg2);}
.btn-p{background:var(--pd);color:#fff;border-color:var(--pd);}
.btn-p:hover{background:var(--p);}
.btn-r{background:var(--rd);color:#fff;border-color:var(--rd);}
.content{padding:20px 22px;}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px;}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
@media(max-width:768px){.grid4,.grid3{grid-template-columns:1fr 1fr;}.grid2{grid-template-columns:1fr;}.sidebar{width:160px;}.main{margin-left:160px;}}
@media(max-width:520px){.sidebar{display:none;}.main{margin-left:0;}}
.kpi{background:var(--bg);border:0.5px solid var(--border);border-radius:10px;padding:14px;}
.kpi-lbl{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);margin-bottom:6px;}
.kpi-val{font-size:22px;font-weight:700;color:var(--ink);}
.kpi-sub{font-size:11px;color:var(--ink3);margin-top:3px;}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px;}
.card-head{padding:12px 16px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--ink2);}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:500px;}
th{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);padding:9px 12px;border-bottom:0.5px solid var(--border);text-align:left;font-weight:500;background:var(--bg2);}
td{padding:9px 12px;border-bottom:0.5px solid var(--border);color:var(--ink2);font-size:12px;}
tr:last-child td{border-bottom:0;}
tr:hover td{background:var(--bg2);}
.badge{display:inline-block;padding:2px 8px;font-size:9px;border-radius:20px;font-weight:500;}
.b-paid{background:var(--gl);color:var(--gt);}
.b-pending{background:var(--al);color:var(--at);}
.b-overdue{background:var(--rl);color:var(--rt);}
.b-disputed{background:var(--pl);color:var(--pt);}
.b-partial{background:#E6F1FB;color:#0C447C;}
.b-air{background:var(--pl);color:var(--pt);}
.b-sea{background:var(--gl);color:var(--gt);}
.b-transit{background:var(--al);color:var(--at);}
.b-delivered{background:var(--gl);color:var(--gt);}
.b-booked{background:#E6F1FB;color:#0C447C;}
.b-high{background:var(--rl);color:var(--rt);}
.b-medium{background:var(--al);color:var(--at);}
.b-low{background:var(--gl);color:var(--gt);}
.search{padding:7px 11px;border:0.5px solid var(--border2);background:var(--bg);color:var(--ink);font-size:12px;border-radius:6px;width:180px;}
.search:focus{outline:none;border-color:var(--pd);}
.form-lbl{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);margin-bottom:5px;display:block;}
.form-in{width:100%;padding:8px 10px;border:0.5px solid var(--border2);background:var(--bg);color:var(--ink);font-size:12px;border-radius:6px;margin-bottom:12px;}
.form-in:focus{outline:none;border-color:var(--pd);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.alert-bar{padding:9px 14px;border-left:3px solid var(--r);background:var(--rl);border-radius:0 6px 6px 0;margin-bottom:14px;font-size:12px;color:var(--rt);}
.alert-info{border-left-color:var(--pd);background:var(--pl);color:var(--pt);}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--bg);border-radius:12px;border:0.5px solid var(--border);width:460px;max-width:95vw;max-height:90vh;overflow-y:auto;}
.modal-head{padding:14px 18px;border-bottom:0.5px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);}
.modal-body{padding:18px;}
.modal-foot{padding:12px 18px;border-top:0.5px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
.close-x{background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink3);}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--pd);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:32px;text-align:center;color:var(--ink3);font-size:12px;}
.stat-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:0.5px solid var(--border);}
.stat-row:last-child{border-bottom:0;}
.toast{position:fixed;top:16px;right:16px;padding:10px 18px;border-radius:8px;font-size:12px;font-weight:600;z-index:200;display:none;color:#fff;}
.msg-bubble{padding:9px 13px;border-radius:10px;font-size:12px;margin-bottom:8px;max-width:80%;}
.msg-in{background:var(--pl);color:var(--pt);}
.msg-out{background:var(--gl);color:var(--gt);margin-left:auto;}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="shell">
<div class="sidebar">
  <div class="logo-area">
    <div class="logo-txt">FC CARGO</div>
    <div class="logo-sub">Banjul · China Agent</div>
  </div>
  <select class="role-sel" id="roleSelect" onchange="switchRole(this.value)">
    <option value="manager">Manager</option>
    <option value="accountant">Accountant</option>
    <option value="operations">Operations</option>
    <option value="cs">Customer Service</option>
    <option value="client">Client Portal</option>
  </select>
  <div id="navArea"></div>
  <div style="margin-top:auto;padding:12px 14px;font-size:9px;color:rgba(255,255,255,.3);border-top:1px solid rgba(255,255,255,.1);">
    <span class="live-dot"></span> Supabase Connected
  </div>
</div>
<div class="main" id="mainArea"></div>
</div>

<div id="modalLayer" class="modal-overlay">
  <div class="modal">
    <div class="modal-head">
      <span id="modalTitle" style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;"></span>
      <button class="close-x" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-p" id="modalSaveBtn">Save</button>
    </div>
  </div>
</div>

<script>
const SB_URL='https://ezdoxcnzqhmlkijbwwqx.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6ZG94Y256cWhtbGtpamJ3d3F4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MDUxODgsImV4cCI6MjA5NDI4MTE4OH0.EofI5r1tkYsZUVumAhPT11AGR16Ph-ztpaHa3RuvlQU';

async function sb(table,method='GET',body=null,query=''){
  const url=`${SB_URL}/rest/v1/${table}${query}`;
  const headers={'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=representation'};
  const res=await fetch(url,{method,headers,body:body?JSON.stringify(body):null});
  if(!res.ok){const e=await res.text();throw new Error(e);}
  const txt=await res.text();
  return txt?JSON.parse(txt):[];
}
const q=(t,qs='')=>sb(t,'GET',null,qs);
const ins=(t,b)=>sb(t,'POST',b);
const upd=(t,qs,b)=>sb(t,'PATCH',b,qs);

function toast(msg,ok=true){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.background=ok?'#3B6D11':'#A32D2D';t.style.display='block';
  setTimeout(()=>t.style.display='none',3000);
}

function statusClass(s){
  const m={'Paid':'paid','Pending':'pending','Overdue':'overdue','Disputed':'disputed','Partial':'partial','Delivered':'delivered','In Transit':'transit','Booked':'booked','Air':'air','Sea':'sea','High':'high','Medium':'medium','Low':'low','Filed':'disputed','Lien Applied':'overdue'};
  return m[s]||'pending';
}

function loading(){return`<div class="empty"><span class="spinner"></span>Loading...</div>`;}

function filterTbl(id,val){
  const t=document.getElementById(id);if(!t)return;
  t.querySelectorAll('tbody tr').forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(val.toLowerCase())?'':'none';});
}

const ROLES={
  manager:{nav:[{s:'Main',items:[{id:'overview',icon:'ti-layout-dashboard',l:'Overview'},{id:'shipments',icon:'ti-ship',l:'Shipments'},{id:'clients',icon:'ti-users',l:'Clients'}]},{s:'Finance',items:[{id:'invoices',icon:'ti-file-invoice',l:'Invoices'},{id:'payments',icon:'ti-credit-card',l:'Payments'},{id:'receipts',icon:'ti-receipt',l:'Receipts'}]},{s:'Operations',items:[{id:'disputes',icon:'ti-scale',l:'Disputes'},{id:'messages',icon:'ti-message',l:'Messages'}]},{s:'Reports',items:[{id:'staff',icon:'ti-id-badge',l:'Staff'}]}]},
  accountant:{nav:[{s:'Finance',items:[{id:'invoices',icon:'ti-file-invoice',l:'Invoices'},{id:'payments',icon:'ti-credit-card',l:'Payments'},{id:'receipts',icon:'ti-receipt',l:'Receipts'}]}]},
  operations:{nav:[{s:'Ops',items:[{id:'shipments',icon:'ti-ship',l:'Shipments'},{id:'clients',icon:'ti-users',l:'Clients'}]}]},
  cs:{nav:[{s:'Client Ops',items:[{id:'clients',icon:'ti-users',l:'Clients'},{id:'disputes',icon:'ti-scale',l:'Disputes'},{id:'messages',icon:'ti-message',l:'Messages'}]}]},
  client:{nav:[{s:'My Account',items:[{id:'book',icon:'ti-package',l:'Book Shipment'},{id:'myshipments',icon:'ti-ship',l:'My Shipments'},{id:'myinvoices',icon:'ti-file-invoice',l:'My Invoices'},{id:'mymessages',icon:'ti-message',l:'Messages'}]}]}
};

let currentRole='manager',currentPage='overview';

function buildNav(role){
  let h='';
  ROLES[role].nav.forEach(s=>{
    h+=`<div class="nav-sec">${s.s}</div>`;
    s.items.forEach(it=>{
      h+=`<div class="ni ${it.id===currentPage?'active':''}" onclick="nav('${it.id}',this)"><i class="ti ${it.icon}"></i>${it.l}</div>`;
    });
  });
  document.getElementById('navArea').innerHTML=h;
}

function switchRole(r){currentRole=r;currentPage=ROLES[r].nav[0].items[0].id;buildNav(r);renderPage(currentPage);}
function nav(page,el){currentPage=page;document.querySelectorAll('.ni').forEach(n=>n.classList.remove('active'));if(el)el.classList.add('active');renderPage(page);}
function topbar(title,right=''){return`<div class="topbar"><div class="page-title">${title}</div><div class="topbar-right">${right}</div></div>`;}

function renderPage(p){
  const pages={overview:pgOverview,shipments:pgShipments,clients:pgClients,invoices:pgInvoices,payments:pgPayments,receipts:pgReceipts,disputes:pgDisputes,messages:pgMessages,staff:pgStaff,book:pgBook,myshipments:pgMyShipments,myinvoices:pgMyInvoices,mymessages:pgMessages};
  if(pages[p])pages[p]();
}

async function pgOverview(){
  const m=document.getElementById('mainArea');
  m.innerHTML=topbar('Overview',`<span style="font-size:11px;color:var(--ink3);" id="clock"></span><button class="btn btn-p" onclick="openModal('newShipment')">+ New Shipment</button>`)+`<div class="content"><div id="ovBody">${loading()}</div></div>`;
  startClock();
  try{
    const [clients,shipments,invoices,payments]=await Promise.all([q('clients','?select=id'),q('shipments','?select=id,status'),q('invoices','?select=id,amount,status'),q('payments','?select=id,amount_paid')]);
    const unpaid=invoices.filter(i=>i.status!=='Paid').reduce((a,b)=>a+(b.amount||0),0);
    const collected=payments.reduce((a,b)=>a+(b.amount_paid||0),0);
    const activeShip=shipments.filter(s=>s.status!=='Delivered').length;
    document.getElementById('ovBody').innerHTML=`
    <div class="grid4">
      <div class="kpi"><div class="kpi-lbl">Active Shipments</div><div class="kpi-val" style="color:var(--pd)">${activeShip}</div></div>
      <div class="kpi"><div class="kpi-lbl">Total Clients</div><div class="kpi-val">${clients.length}</div></div>
      <div class="kpi"><div class="kpi-lbl">Unpaid Balance</div><div class="kpi-val" style="color:var(--r)">GMD ${unpaid.toLocaleString()}</div></div>
      <div class="kpi"><div class="kpi-lbl">Total Collected</div><div class="kpi-val" style="color:var(--g)">GMD ${collected.toLocaleString()}</div></div>
    </div>
    <div class="grid2">
      <div class="card"><div class="card-head"><span class="card-title">Recent Shipments</span></div><div id="rShip">${loading()}</div></div>
      <div class="card"><div class="card-head"><span class="card-title">Recent Invoices</span></div><div id="rInv">${loading()}</div></div>
    </div>`;
    const [rS,rI]=await Promise.all([q('shipments','?select=ref,status,type,origin&order=created_at.desc&limit=6'),q('invoices','?select=invoice_number,amount,status&order=created_at.desc&limit=6')]);
    document.getElementById('rShip').innerHTML=rS.length?`<div class="tbl-wrap"><table><thead><tr><th>Ref</th><th>Origin</th><th>Type</th><th>Status</th></tr></thead><tbody>${rS.map(s=>`<tr><td style="font-weight:700;color:var(--pd)">${s.ref}</td><td>${s.origin||'—'}</td><td><span class="badge b-${(s.type||'').toLowerCase()}">${s.type||'—'}</span></td><td><span class="badge b-${statusClass(s.status)}">${s.status}</span></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No shipments yet.</div>`;
    document.getElementById('rInv').innerHTML=rI.length?`<div class="tbl-wrap"><table><thead><tr><th>Invoice</th><th>Amount</th><th>Status</th></tr></thead><tbody>${rI.map(i=>`<tr><td style="font-weight:700;color:var(--pd)">${i.invoice_number}</td><td>GMD ${(i.amount||0).toLocaleString()}</td><td><span class="badge b-${statusClass(i.status)}">${i.status}</span></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No invoices yet.</div>`;
  }catch(e){document.getElementById('ovBody').innerHTML=`<div class="empty" style="color:var(--r)">Error: ${e.message}</div>`;}
}

async function pgShipments(){
  const m=document.getElementById('mainArea');
  m.innerHTML=topbar('Shipments',`<input class="search" placeholder="Search..." oninput="filterTbl('sTbl',this.value)"/><button class="btn btn-p" onclick="openModal('newShipment')">+ Add</button>`)+`<div class="content"><div class="card"><div id="shipBody">${loading()}</div></div></div>`;
  try{
    const data=await q('shipments','?select=ref,type,origin,weight,incoterm,departure_date,eta,status&order=created_at.desc');
    document.getElementById('shipBody').innerHTML=data.length?`<div class="tbl-wrap"><table id="sTbl"><thead><tr><th>Ref</th><th>Type</th><th>Origin</th><th>Weight</th><th>Depart</th><th>ETA</th><th>Status</th><th>Incoterm</th></tr></thead><tbody>${data.map(s=>`<tr><td style="font-weight:700;color:var(--pd)">${s.ref}</td><td><span class="badge b-${(s.type||'').toLowerCase()}">${s.type||'—'}</span></td><td>${s.origin||'—'}</td><td>${s.weight||'—'}</td><td>${s.departure_date||'—'}</td><td>${s.eta||'—'}</td><td><span class="badge b-${statusClass(s.status)}">${s.status}</span></td><td>${s.incoterm||'—'}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No shipments yet.</div>`;
  }catch(e){document.getElementById('shipBody').innerHTML=`<div class="empty" style="color:var(--r)">${e.message}</div>`;}
}

async function pgClients(){
  const m=document.getElementById('mainArea');
  m.innerHTML=topbar('Clients',`<input class="search" placeholder="Search..." oninput="filterTbl('cTbl',this.value)"/><button class="btn btn-p" onclick="openModal('newClient')">+ Add Client</button>`)+`<div class="content"><div class="card"><div id="clientBody">${loading()}</div></div></div>`;
  try{
    const data=await q('clients','?select=name,phone,email,address,credit_limit,risk_level&order=created_at.desc');
    document.getElementById('clientBody').innerHTML=data.length?`<div class="tbl-wrap"><table id="cTbl"><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Address</th><th>Credit Limit</th><th>Risk</th></tr></thead><tbody>${data.map(c=>`<tr><td style="font-weight:700;color:var(--pd)">${c.name}</td><td>${c.phone||'—'}</td><td>${c.email||'—'}</td><td>${c.address||'—'}</td><td>GMD ${(c.credit_limit||0).toLocaleString()}</td><td><span class="badge b-${(c.risk_level||'low').toLowerCase()}">${c.risk_level||'Low'}</span></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No clients yet.</div>`;
  }catch(e){document.getElementById('clientBody').innerHTML=`<div class="empty" style="color:var(--r)">${e.message}</div>`;}
}

async function pgInvoices(){
  const m=document.getElementById('mainArea');
  m.innerHTML=topbar('Invoices',`<input class="search" placeholder="Search..." oninput="filterTbl('invTbl',this.value)"/><button class="btn btn-p" onclick="openModal('newInvoice')">+ New Invoice</button>`)+`<div class="content"><div class="card"><div id="invBody">${loading()}</div></div></div>`;
  try{
    const data=await q('invoices','?select=invoice_number,amount,status,date,due_date,description&order=created_at.desc');
    document.getElementById('invBody').innerHTML=data.length?`<div class="tbl-wrap"><table id="invTbl"><thead><tr><th>Invoice</th><th>Description</th><th>Date</th><th>Due</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody>${data.map(i=>`<tr><td style="font-weight:700;color:var(--pd)">${i.invoice_number}</td><td>${i.description||'—'}</td><td>${i.date||'—'}</td><td>${i.due_date||'—'}</td><td>GMD ${(i.amount||0).toLocaleString()}</td><td><span class="badge b-${statusClass(i.status)}">${i.status}</span></td><td>${i.status!=='Paid'?`<button class="btn" style="font-size:10px;padding:3px 8px;" onclick="markPaid('${i.invoice_number}')">Mark Paid</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No invoices yet.</div>`;
  }catch(e){document.getElementById('invBody').innerHTML=`<div class="empty" style="color:var(--r)">${e.message}</div>`;}
}

async function pgPayments(){
  const m=document.getElementById('mainArea');
  m.innerHTML=topbar('Payments',`<button class="btn btn-p" onclick="openModal('newPayment')">+ Record Payment</button>`)+`<div class="content"><div class="card"><div id="payBody">${loading()}</div></div></div>`;
  try{
    const data=await q('payments','?select=amount_paid,payment_date,method,status,recorded_by&order=created_at.desc');

  const m=document.getElementById('mainArea');
  m.innerHTML=topbar('Messages',`<span class="live-dot"></span>`)+`<div class="content"><div class="card"><div id="msgList">${loading()}</div></div><div class="card" style="padding:16px;"><div style="font-size:12px;font-weight:700;color:var(--pd);margin-bottom:12px;">Send Message</div><label class="form-lbl">From</label><input class="form-in" id="msgSender" placeholder="Your name"/><label class="form-lbl">Message</label><textarea class="form-in" id="msgText" rows="3" placeholder="Type your message..."></textarea><button class="btn btn-p" onclick="sendMsg()"><i class="ti ti-send"></i> Send</button></div></div>`;

function pgBook(){
  document.getElementById('mainArea').innerHTML=topbar('Book a Shipment','')+`<div class="content"><div class="alert-bar alert-info">Submit your booking and FC Cargo will confirm within 2 hours with your shipment reference.</div><div class="card" style="padding:18px;max-width:520px;"><label class="form-lbl">Your Name / Company</label><input class="form-in" id="bkName" placeholder="e.g. Bah Enterprises"/><div class="form-grid"><div><label class="form-lbl">Phone</label><input class="form-in" id="bkPhone" placeholder="+220 ..."/></div><div><label class="form-lbl">Email</label><input class="form-in" id="bkEmail"/></div></div><label class="form-lbl">Freight Type</label><select class="form-in" id="bkType"><option>Sea</option><option>Air</option></select><div class="form-grid"><div><label class="form-lbl">Origin City (China)</label><input class="form-in" id="bkOrigin" placeholder="Guangzhou"/></div><div><label class="form-lbl">Weight / CBM</label><input class="form-in" id="bkWeight" placeholder="5 CBM"/></div></div><label class="form-lbl">Goods Description</label><input class="form-in" id="bkGoods" placeholder="e.g. Textiles, 50 cartons"/><button class="btn btn-p" style="width:100%;padding:10px;margin-top:4px;" onclick="submitBooking()"><i class="ti ti-send"></i> Submit Booking</button></div></div>`;
}

  const m=document.getElementById('mainArea');
  m.innerHTML=topbar('My Invoices','')+`<div class="content"><div class="card"><div id="myInvBody">${loading()}</div></div></div>`;

async function markPaid(invNum){
  try{await upd('invoices',`?invoice_number=eq.${invNum}`,{status:'Paid'});toast('Invoice marked as paid');pgInvoices();}
  catch(e){toast(e.message,false);}
}

async function sendMsg(){
  const sender=document.getElementById('msgSender').value.trim();
  const body=document.getElementById('msgText').value.trim();
  if(!sender||!body){toast('Enter sender and message',false);return;}
  try{await ins('messages',{sender,body,is_read:false});toast('Message sent');pgMessages();}
  catch(e){toast(e.message,false);}
}

async function submitBooking(){
  const name=document.getElementById('bkName').value.trim();
  const phone=document.getElementById('bkPhone').value.trim();
  const email=document.getElementById('bkEmail').value.trim();
  const type=document.getElementById('bkType').value;
  const origin=document.getElementById('bkOrigin').value.trim();
  const weight=document.getElementById('bkWeight').value.trim();
  const goods=document.getElementById('bkGoods').value.trim();
  if(!name||!origin){toast('Name and origin city are required',false);return;}
  try{
    try{await ins('clients',{name,phone,email,address:'Banjul',credit_limit:0,risk_level:'Low'});}catch(e){}
    const ref='FC-'+Math.floor(Math.random()*9000+1000);
    await ins('shipments',{ref,type,origin,weight,notes:goods,status:'Booked',incoterm:'FOB/DAP'});
    toast('Booking submitted! Your ref: '+ref);
  }catch(e){toast(e.message,false);}
}

const MODAL_FORMS={
  newShipment:`<div class="form-grid"><div><label class="form-lbl">Ref</label><input class="form-in" id="mRef" placeholder="FC-2502"/></div><div><label class="form-lbl">Type</label><select class="form-in" id="mType"><option>Sea</option><option>Air</option></select></div></div><label class="form-lbl">Origin (China)</label><input class="form-in" id="mOrigin" placeholder="Guangzhou"/><label class="form-lbl">Weight / CBM</label><input class="form-in" id="mWeight" placeholder="5.2 CBM"/><label class="form-lbl">Incoterm</label><select class="form-in" id="mInco"><option>FOB/DAP</option><option>EXW/DAP</option><option>EXW/DDP</option></select><div class="form-grid"><div><label class="form-lbl">Departure Date</label><input class="form-in" type="date" id="mDep"/></div><div><label class="form-lbl">ETA Banjul</label><input class="form-in" type="date" id="mEta"/></div></div>`,
  newClient:`<label class="form-lbl">Name / Company</label><input class="form-in" id="mName"/><div class="form-grid"><div><label class="form-lbl">Phone</label><input class="form-in" id="mPhone" placeholder="+220 ..."/></div><div><label class="form-lbl">Email</label><input class="form-in" id="mEmail"/></div></div><label class="form-lbl">Address</label><input class="form-in" id="mAddr"/><div class="form-grid"><div><label class="form-lbl">Credit Limit (GMD)</label><input class="form-in" type="number" id="mCredit"/></div><div><label class="form-lbl">Risk Level</label><select class="form-in" id="mRisk"><option>Low</option><option>Medium</option><option>High</option></select></div></div>`,
  newInvoice:`<div class="form-grid"><div><label class="form-lbl">Invoice #</label><input class="form-in" id="mInvNum" placeholder="INV-0893"/></div><div><label class="form-lbl">Amount (GMD)</label><input class="form-in" type="number" id="mAmount"/></div></div><div class="form-grid"><div><label class="form-lbl">Date</label><input class="form-in" type="date" id="mDate"/></div><div><label class="form-lbl">Due Date</label><input class="form-in" type="date" id="mDue"/></div></div><label class="form-lbl">Description</label><input class="form-in" id="mDesc" placeholder="Shipment FC-XXXX"/>`,
  newPayment:`<label class="form-lbl">Amount Received (GMD)</label><input class="form-in" type="number" id="mPayAmt"/><div class="form-grid"><div><label class="form-lbl">Method</label><select class="form-in" id="mPayMethod"><option>Cash</option><option>Bank Transfer</option><option>Mobile Money</option></select></div><div><label class="form-lbl">Date</label><input class="form-in" type="date" id="mPayDate"/></div></div><label class="form-lbl">Recorded By</label><input class="form-in" id="mPayBy" placeholder="Staff name"/>`,
  newDispute:`<div class="form-grid"><div><label class="form-lbl">Case #</label><input class="form-in" id="mCaseNum" placeholder="DSP-003"/></div><div><label class="form-lbl">Amount (GMD)</label><input class="form-in" type="number" id="mDispAmt"/></div></div><label class="form-lbl">Reason</label><select class="form-in" id="mReason"><option>COD Refused at Delivery</option><option>Partial Payment Only</option><option>Goods Damaged Claim</option><option>Wrong Goods</option></select><label class="form-lbl">Incoterm Applied</label><select class="form-in" id="mDispInco"><option>DAP</option><option>DDP</option><option>FOB</option></select>`,
  newStaff:`<label class="form-lbl">Full Name</label><input class="form-in" id="mStaffName"/><div class="form-grid"><div><label class="form-lbl">Role</label><select class="form-in" id="mStaffRole"><option>General Manager</option><option>Accountant</option><option>Operations Manager</option><option>Customs Broker</option><option>Customer Service</option><option>Warehouse</option><option>China Liaison</option></select></div><div><label class="form-lbl">Department</label><select class="form-in" id="mStaffDept"><option>Management</option><option>Finance</option><option>Operations</option><option>Customer Service</option><option>Warehouse</option></select></div></div><label class="form-lbl">Phone</label><input class="form-in" id="mStaffPhone" placeholder="+220 ..."/><label class="form-lbl">Access Level</label><select class="form-in" id="mStaffAccess"><option>Full</option><option>Finance</option><option>Operations</option><option>Client-facing</option><option>Limited</option></select>`
};

const MODAL_SAVES={
  newShipment:async()=>{
    const ref=document.getElementById('mRef').value.trim();
    if(!ref)throw new Error('Ref required');
    await ins('shipments',{ref,type:document.getElementById('mType').value,origin:document.getElementById('mOrigin').value,weight:document.getElementById('mWeight').value,incoterm:document.getElementById('mInco').value,departure_date:document.getElementById('mDep').value||null,eta:document.getElementById('mEta').value||null,status:'Booked'});
    toast('Shipment added');pgShipments();
  },
  newClient:async()=>{
    const name=document.getElementById('mName').value.trim();
    if(!name)throw new Error('Name required');
    await ins('clients',{name,phone:document.getElementById('mPhone').value,email:document.getElementById('mEmail').value,address:document.getElementById('mAddr').value,credit_limit:parseFloat(document.getElementById('mCredit').value)||0,risk_level:document.getElementById('mRisk').value});
    toast('Client added');pgClients();
  },
  newInvoice:async()=>{
    const inv=document.getElementById('mInvNum').value.trim();
    const amt=parseFloat(document.getElementById('mAmount').value);
    if(!inv||!amt)throw new Error('Invoice number and amount required');
    await ins('invoices',{invoice_number:inv,amount:amt,date:document.getElementById('mDate').value||null,due_date:document.getElementById('mDue').value||null,description:document.getElementById('mDesc').value,status:'Pending'});
    toast('Invoice created');pgInvoices();
  },
  newPayment:async()=>{
    const amt=parseFloat(document.getElementById('mPayAmt').value);
    if(!amt)throw new Error('Amount required');
    await ins('payments',{amount_paid:amt,method:document.getElementById('mPayMethod').value,payment_date:document.getElementById('mPayDate').value||null,recorded_by:document.getElementById('mPayBy').value,status:'Confirmed'});
    toast('Payment recorded');pgPayments();
  },
  newDispute:async()=>{
    const cn=document.getElementById('mCaseNum').value.trim();
    if(!cn)throw new Error('Case number required');
    await ins('disputes',{case_number:cn,reason:document.getElementById('mReason').value,amount:parseFloat(document.getElementById('mDispAmt').value)||0,incoterm_applied:document.getElementById('mDispInco').value,stage:'Filed',days_open:0});
    toast('Dispute logged');pgDisputes();
  },
  newStaff:async()=>{
    const name=document.getElementById('mStaffName').value.trim();
    if(!name)throw new Error('Name required');
    await ins('staff',{name,role:document.getElementById('mStaffRole').value,department:document.getElementById('mStaffDept').value,phone:document.getElementById('mStaffPhone').value,access_level:document.getElementById('mStaffAccess').value,is_active:true});
    toast('Staff added');pgStaff();
  }
};

function openModal(key){
  document.getElementById('modalTitle').textContent=key.replace(/([A-Z])/g,' $1').trim();
  document.getElementById('modalBody').innerHTML=MODAL_FORMS[key]||'';
  document.getElementById('modalSaveBtn').onclick=async()=>{
    try{await MODAL_SAVES[key]();closeModal();}catch(e){toast(e.message,false);}
  };
  document.getElementById('modalLayer').classList.add('open');
}
function closeModal(){document.getElementById('modalLayer').classList.remove('open');}
document.getElementById('modalLayer').addEventListener('click',e=>{if(e.target===document.getElementById('modalLayer'))closeModal();});

function startClock(){
  const el=document.getElementById('clock');
  if(el)el.textContent=new Date().toLocaleTimeString();
  setTimeout(startClock,1000);
}

switchRole('manager');
</script>
